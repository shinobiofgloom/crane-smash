<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Crane Smash</title>
<style>
  :root {
    --navy: #1d2b53;
    --gelb: #ffcc00;
    --gelb-dunkel: #e0a800;
    --gruen: #3bceac;
    --rot: #ff5d73;
    --weiss: #ffffff;
    --schrift: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #5cb8f0; font-family: var(--schrift); color: var(--weiss);
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
  }
  canvas#spielfeld { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  svg.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; }

  /* ---------- Anzeige oben ---------- */
  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
    pointer-events: none;
  }
  .pille {
    background: rgba(29, 43, 83, 0.82); border: 3px solid var(--navy); border-radius: 999px;
    padding: 4px 12px; font-weight: 900; font-size: 17px; line-height: 1.2; white-space: nowrap;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  #hudLinks { display: flex; align-items: center; gap: 8px; order: 1; }
  #birnenAnzeige { display: flex; gap: 3px; font-size: 20px; }
  #birnenAnzeige .leer { opacity: 0.28; }
  #hudMitte { order: 2; flex: 1 1 200px; display: flex; justify-content: center; min-width: 160px; }
  #hudRechts { display: flex; align-items: center; gap: 8px; order: 3; }
  #fortschritt {
    position: relative; width: min(100%, 340px); height: 28px; border-radius: 999px;
    background: rgba(29, 43, 83, 0.82); border: 3px solid var(--navy); overflow: visible;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  #balken {
    position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0; border-radius: 999px;
    background: linear-gradient(#ffe066, #ffb400); transition: width 0.25s ease-out;
  }
  #fortschritt.erreicht #balken { background: linear-gradient(#7cf0c8, #2fb894); }
  #prozentText {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px; text-shadow: 0 2px 0 var(--navy), 0 0 3px var(--navy);
  }
  .marke {
    position: absolute; top: -9px; width: 22px; height: 22px; margin-left: -11px; font-size: 22px;
    color: #9aa6c4; filter: drop-shadow(0 2px 0 var(--navy));
  }
  .marke.an { color: var(--gelb); }
  #zielStrich { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: rgba(255,255,255,0.85); }
  #muenzAnzeige { display: flex; align-items: center; gap: 5px; }
  #muenzAnzeige svg { font-size: 20px; }
  .rundknopf {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--navy);
    background: var(--weiss); color: var(--navy); font-size: 22px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25); cursor: pointer; padding: 0;
  }
  .rundknopf:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  @media (max-width: 560px) {
    #hudMitte { order: 4; flex-basis: 100%; }
    .pille { font-size: 15px; }
  }

  /* ---------- Levelbanner ---------- */
  #banner {
    position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(0.8); z-index: 4;
    text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.25s, transform 0.25s;
    font-weight: 900; text-shadow: 0 4px 0 var(--navy), 0 0 6px var(--navy);
  }
  #banner.sichtbar { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #bannerTitel { font-size: clamp(34px, 8vw, 60px); color: var(--weiss); -webkit-text-stroke: 2px var(--navy); }
  #bannerZiel { font-size: clamp(20px, 5vw, 30px); color: var(--gelb); margin-top: 4px; }

  /* ---------- Fenster ---------- */
  .schleier {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 20, 50, 0.45); padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .schleier.offen { opacity: 1; pointer-events: auto; }
  .karte {
    width: min(420px, 100%); max-height: 100%; overflow-y: auto; background: #fff7e6; color: var(--navy);
    border: 4px solid var(--navy); border-radius: 22px; padding: 16px 16px 18px; text-align: center;
    box-shadow: 0 8px 0 rgba(0,0,0,0.3); transform: scale(0.9); transition: transform 0.2s;
  }
  .schleier.offen .karte { transform: scale(1); }
  #ergSterne { display: flex; justify-content: center; gap: 6px; font-size: 54px; margin-top: -2px; }
  #ergSterne .s { color: #d5d9e4; filter: drop-shadow(0 3px 0 var(--navy)); transform: scale(0.5); opacity: 0.6; transition: transform 0.3s cubic-bezier(.3,1.8,.5,1), color 0.2s, opacity 0.2s; }
  #ergSterne .s:nth-child(2) { font-size: 66px; margin-top: -10px; }
  #ergSterne .s.an { color: var(--gelb); transform: scale(1); opacity: 1; }
  #ergTitel { font-size: 30px; font-weight: 900; margin: 2px 0 0; }
  #ergProzent { font-size: 18px; font-weight: 800; opacity: 0.8; margin-bottom: 8px; }
  #ergPosten { list-style: none; margin: 0 0 8px; padding: 0; text-align: left; }
  #ergPosten li {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 10px; font-weight: 800; font-size: 16px;
  }
  #ergPosten li:nth-child(odd) { background: rgba(29, 43, 83, 0.06); }
  #ergPosten li .wert { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  #ergPosten li svg { font-size: 20px; }
  #ergSumme { font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0 12px; }
  .knoepfe { display: flex; gap: 10px; justify-content: center; }
  .knopf {
    position: relative; border: 4px solid var(--navy); border-radius: 16px; background: var(--weiss); color: var(--navy);
    font-family: var(--schrift); font-weight: 900; font-size: 18px; padding: 10px 14px; min-height: 56px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 0 var(--navy);
  }
  .knopf:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
  .knopf.haupt { background: var(--gruen); color: var(--weiss); text-shadow: 0 2px 0 var(--navy); flex: 1 1 auto; font-size: 22px; }
  .knopf svg { font-size: 24px; }
  .knopf .punkt {
    position: absolute; top: -10px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--rot);
    color: var(--weiss); border: 3px solid var(--navy); font-size: 14px; line-height: 18px; display: none;
  }
  .knopf .punkt.an { display: block; animation: hupf 0.9s infinite; }
  @keyframes hupf { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  #ladenMuenzen { font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; }
  #ladenGitter { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .upkarte {
    border: 3px solid var(--navy); border-radius: 16px; background: var(--weiss); padding: 10px 8px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .upkarte .bild { font-size: 40px; line-height: 1; }
  .upkarte .name { font-weight: 900; font-size: 15px; }
  .upkarte .info { font-size: 12px; font-weight: 700; opacity: 0.7; min-height: 15px; }
  .upkarte .stufen { display: flex; gap: 4px; margin: 2px 0 4px; }
  .upkarte .stufen i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--navy); background: #e3e7f0; }
  .upkarte .stufen i.an { background: var(--gelb); }
  .upkarte button {
    width: 100%; min-height: 40px; border: 3px solid var(--navy); border-radius: 12px; background: var(--gelb); color: var(--navy);
    font-family: var(--schrift); font-weight: 900; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    box-shadow: 0 3px 0 var(--navy);
  }
  .upkarte button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--navy); }
  .upkarte button:disabled { background: #e3e7f0; color: #8a93a8; cursor: default; box-shadow: none; transform: none; }
  .upkarte.gekauft { animation: blitz 0.4s; }
  @keyframes blitz { 0% { transform: scale(1); } 40% { transform: scale(1.08); background: #fff4c2; } 100% { transform: scale(1); } }
</style>
</head>
<body>

<canvas id="spielfeld"></canvas>

<div id="hud">
  <div id="hudLinks">
    <div class="pille" id="levelAnzeige">Level 1</div>
    <div class="pille" id="birnenAnzeige"></div>
  </div>
  <div id="hudMitte">
    <div id="fortschritt">
      <div id="balken"></div>
      <div id="zielStrich"></div>
      <svg class="icon marke ziel" id="marke0"><use href="#i-stern"/></svg>
      <svg class="icon marke" id="marke1"><use href="#i-stern"/></svg>
      <svg class="icon marke" id="marke2"><use href="#i-stern"/></svg>
      <div id="prozentText">0%</div>
    </div>
  </div>
  <div id="hudRechts">
    <div class="pille" id="muenzAnzeige"><svg class="icon"><use href="#i-muenze"/></svg><span id="muenzZahl">0</span></div>
    <button class="rundknopf" id="tonKnopf" aria-label="Sound"><svg class="icon"><use href="#i-ton-an"/></svg></button>
  </div>
</div>

<div id="banner"><div id="bannerTitel">Level 1</div><div id="bannerZiel"></div></div>

<div class="schleier" id="ergebnis">
  <div class="karte">
    <div id="ergSterne">
      <svg class="icon s"><use href="#i-stern"/></svg>
      <svg class="icon s"><use href="#i-stern"/></svg>
      <svg class="icon s"><use href="#i-stern"/></svg>
    </div>
    <div id="ergTitel"></div>
    <div id="ergProzent"></div>
    <ul id="ergPosten"></ul>
    <div id="ergSumme"><svg class="icon"><use href="#i-muenze"/></svg><span id="ergSummeZahl">+0</span></div>
    <div class="knoepfe">
      <button class="knopf" id="knopfNochmal" aria-label="Retry"><svg class="icon"><use href="#i-nochmal"/></svg></button>
      <button class="knopf" id="knopfLaden" aria-label="Upgrades"><svg class="icon"><use href="#i-werkzeug"/></svg><span class="punkt" id="ladenPunkt">!</span></button>
      <button class="knopf haupt" id="knopfWeiter"><span id="knopfWeiterText">Next</span><svg class="icon"><use href="#i-weiter"/></svg></button>
    </div>
  </div>
</div>

<div class="schleier" id="laden">
  <div class="karte">
    <div id="ladenTitel" style="font-size:26px;font-weight:900;margin-bottom:4px">Upgrades</div>
    <div id="ladenMuenzen"><svg class="icon"><use href="#i-muenze"/></svg><span id="ladenMuenzZahl">0</span></div>
    <div id="ladenGitter"></div>
    <div class="knoepfe"><button class="knopf haupt" id="knopfLadenFertig">Done</button></div>
  </div>
</div>
